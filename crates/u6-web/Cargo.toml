[package]
name = "u6-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
u6-core.workspace = true
u6-intake.workspace = true
u6-render.workspace = true
# Spec 07 H2: the HD pack the page loads (its strict reader) and the drop classifier.
u6-hdpack.workspace = true
# Must equal the installed wasm-bindgen CLI version (scripts/build-web.sh).
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# Content-free equality for the real-data tests (spec 01 §Rights).
u6-testkit.workspace = true
