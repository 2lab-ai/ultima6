[package]
name = "u6-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Spec 13 Wide mode (`site/pkg-wide`); off, the Original build (`site/pkg`).
wide = ["u6-core/wide", "u6-render/wide"]

[dependencies]
u6-core.workspace = true
# Spec 08: the Hangul table's type (the table itself is site/fonts/galmuri7-hangul.bin).
u6-formats.workspace = true
u6-intake.workspace = true
u6-render.workspace = true
# Spec 07 H2: the HD pack the page loads (its strict reader) and the drop classifier.
u6-hdpack.workspace = true
# Must equal the installed wasm-bindgen CLI version (scripts/build-web.sh).
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# Content-free equality for the real-data tests (spec 01 §Rights).
u6-testkit.workspace = true
