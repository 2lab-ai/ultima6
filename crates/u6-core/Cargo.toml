[package]
name = "u6-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
u6-formats.workspace = true
u6-render.workspace = true
u6-audio.workspace = true
# Spec 07 H2: the HD pack the page loads (its images and the content hash it keys them by; the
# engine keys its images with the same function).
u6-hdpack.workspace = true
# The conversation catalog's JSON form (spec 08 Design 6; converse/disasm/catalog.rs), the
# versions u6-hdpack already uses.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"

[dev-dependencies]
# Real-data test only: zip -> files, exactly as the platforms do it.
u6-intake.workspace = true
# Content-free equality for the real-data tests (spec 01 §Rights).
u6-testkit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Runs the executor gate (tests/nested_prompt.rs) under wasm-bindgen-test-runner (node).
# Must match the installed wasm-bindgen CLI (0.2.129).
wasm-bindgen-test = "=0.3.79"
