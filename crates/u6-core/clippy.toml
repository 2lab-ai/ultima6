# u6-core is platform-free: no I/O, no clocks, no environment (see the crate doc).
disallowed-types = [
    "std::time::Instant",
    "std::time::SystemTime",
    "std::fs::File",
    "std::fs::OpenOptions",
    "std::net::TcpStream",
    "std::net::UdpSocket",
]
disallowed-methods = [
    { path = "u6_core::image::GameImage::cstr", reason = "game text reads require a registered string_registry::Text; u/end have narrow separate-program boundaries" },
    { path = "u6_core::objects::commands::data::GameData::cstr", reason = "loaded game text reads require a registered string_registry::Text" },
    "std::fs::read",
    "std::fs::read_to_string",
    "std::fs::write",
    "std::fs::read_dir",
    "std::env::var",
    "std::env::args",
    "std::thread::sleep",
    "std::thread::spawn",
]
